# Independent verification — the server-side half of Article 8 (docs/00-constitution.md).
#
# Local verification evidence is self-attested and never committed; this workflow re-runs
# the whole mandatory suite on a clean checkout and then asks whether each commit's
# Verified-State trailer refers to the tree it actually records. See tools/gates/CI.md.
#
# WHAT THE FIRST RUN TAUGHT THIS FILE (run 37185128292, tools/gates/CI.md):
#   - one step may not run more than one leg. `trilateral.mjs` runs typecheck, the
#     module-load gate AND the suite, so a failing TEST was reported as a failing BUILD with
#     no test name in the log. The build step is now `--legs typecheck,build`, and the suite
#     has its own step with the spec reporter.
#   - one Node version is not "Node". The defect that run found reproduces on 22 and not on
#     24, so both lines are a matrix and `fail-fast: false` keeps the second answer.
#   - the runner image is pinned. `ubuntu-latest` would move the evidence under the project.
#   - a SKIPPED conformance row means something different here than on a laptop: this runner
#     is PROVISIONED, so python, java and rust are REQUIRED. cpp stays UNEXECUTED.
#
# Least privilege: contents: read and nothing else, no secret, no persisted credential,
# every action pinned to a full commit SHA, and the plain pull_request trigger only —
# never the privileged target variant, which would run fork code with write access.
name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      # Both lines are wanted even when one fails: "it breaks on 22 only" is the finding.
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      # SHAs resolved from the official tags on 2026-10-03 (read-only `gh api`).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On a pull request the default checkout is the merge commit, which carries no
          # trailer and never could; the trailer check must see the real head commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Deep: ci-trailer.mjs asks git whether a commit is an ancestor of the
          # Article-8 boundary, and a shallow clone cannot answer.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # engines.node names exactly the lines this matrix verifies: 22 and 24.
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: install from the lockfile
        run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: build (module load, NOT the suite)
        run: node tools/gates/trilateral.mjs --legs typecheck,build
      - name: tests
        shell: bash
        run: node --test --test-reporter=spec 2>&1 | tee "$RUNNER_TEMP/tests.log"
      - name: gates (size, secrets, deps, boundaries)
        run: npm run gates
      - name: release gate
        run: node tools/gates/check-all.mjs --release
      - name: cell state
        run: node tools/cellmode/cli.mjs check
      - name: toolchains present on this runner
        shell: bash
        run: |
          rustc --version
          python --version
          "$JAVA_HOME/bin/java" -version
      - name: upp conformance (python, java and rust REQUIRED; cpp stays UNEXECUTED)
        run: npm run upp:conformance -- --require python,java,rust
      - name: Verified-State trailer and job summary
        shell: bash
        run: node tools/gates/ci-trailer.mjs --counts "$RUNNER_TEMP/tests.log"
